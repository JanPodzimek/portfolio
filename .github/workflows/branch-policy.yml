name: Branch policy

# The required `branch-policy` check. It lives in its own workflow, triggered only by pull
# requests, so a push run never reports a `branch-policy` check run: a job skipped by `if:` still
# reports one, GitHub counts a skipped required check as passed, and a release PR from an already
# pushed commit (develop → rc) would be mergeable before its policy was ever evaluated.
# `edited` re-runs the check when a PR is retargeted to another base branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR; a newer event cancels the outdated run.
concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Checkout needs to read the repository; nothing else.
permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-branch-policy.mjs
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
